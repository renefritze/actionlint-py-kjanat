# this job builds and publishes a test package
# the dev version is derived from the run number and the release version from
# the git tags, so neither is ever committed back to the branch
name: Build test release
on:
  pull_request:
    # only PR to main
    branches:
      - main
  workflow_dispatch:

env:
  # unique and monotonic per run, so nothing has to be committed back to the
  # branch - a push here would retrigger this workflow on every run
  ACTIONLINT_PY_DEV_VERSION: ${{ github.run_number }}
  # uv downloads this itself, so no separate python setup step is needed.
  # bdist_wheel tags the wheel py2.py3-none-<plat>, so the interpreter never
  # reaches the artifact - it is pinned only to keep the builds predictable.
  UV_PYTHON: '3.12'

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          # version.py reads the tags and the distance to them
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - run: |
          uv build --sdist
          VERSION=$(uv run --no-project python ./_custom_build/version.py)
          {
          echo "# Test pip install call"
          echo '```pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ --pre actionlint-py-kjanat=='"$VERSION"'```'
          } >> "$GITHUB_STEP_SUMMARY"

      - run: |
          {
          echo "# Twine check (sdist)"
          uvx twine check dist/*
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/

  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          # checksums.cfg's [linux-x86_64] / [linux-arm64] binaries are static
          # Go executables with no glibc symbol version dependency, so the
          # manylinux tag is truthful, not just permissive - and it is the only
          # tag PyPI accepts for a Linux wheel at all ("linux_x86_64" is not).
          - os: ubuntu-latest
            manylinux-tag: manylinux_2_17_x86_64.manylinux2014_x86_64
          - os: ubuntu-24.04-arm
            manylinux-tag: manylinux_2_17_aarch64.manylinux2014_aarch64
          # macOS and Windows already get a PyPI-valid tag (e.g.
          # macosx_11_0_arm64, win_amd64) from bdist_wheel by default. No Intel
          # macOS runner: GitHub retired macos-13, and cross-tagging an
          # aarch64-built wheel as x86_64 would ship the wrong binary inside it.
          - os: macos-14
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        # bash everywhere. Under the Windows default (pwsh) a
        # `{ ... } >> "$GITHUB_STEP_SUMMARY"` block is silently a no-op - pwsh
        # appends the block's own source text instead of running it - and
        # `dist/*.whl` never expands either, so those steps only looked green.
        shell: bash
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          # version.py reads the tags and the distance to them
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - run: uv build --wheel

      - name: Retag the wheel as manylinux
        if: matrix.manylinux-tag
        run: uvx --from wheel wheel tags --platform-tag "${{ matrix.manylinux-tag }}" --remove dist/*.whl

      - run: |
          {
          echo "# Twine check (${{ matrix.os }} wheel)"
          uvx twine check dist/*
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the wheel and lint with the binary it carries
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test dist/*.whl
          run_actionlint() { uv run --no-project --python .wheel-test actionlint "$@"; }

          run_actionlint --version

          # a binary that only prints its version is not proven to work, so lint
          # one clean workflow and one whose error actionlint has to catch, and
          # require the two to disagree. The error is a missing `steps`, checked
          # by the parser itself rather than against the bundled runner label
          # list, which changes between actionlint releases.
          mkdir -p .wheel-smoke
          cat > .wheel-smoke/valid.yml <<'YAML'
          name: wheel smoke test
          on: push
          jobs:
            smoke:
              runs-on: ubuntu-latest
              steps:
                - run: echo hello
          YAML
          cat > .wheel-smoke/invalid.yml <<'YAML'
          name: wheel smoke test
          on: push
          jobs:
            smoke:
              runs-on: ubuntu-latest
          YAML
          run_actionlint .wheel-smoke/valid.yml
          if run_actionlint .wheel-smoke/invalid.yml; then
            echo "::error::the packaged actionlint accepted a job with no steps"
            exit 1
          fi

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.os }}
          path: dist/*.whl

  publish-to-test:
    name: Publish to test Pypi
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: TestPyPI
    # trusted publishing: the OIDC token replaces an API token entirely
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # a re-run reuses the run number, so matching files are already uploaded
          skip-existing: true
