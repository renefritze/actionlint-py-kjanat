# this job builds and publishes a test package
# the dev version is derived from the run number and the release version from
# the git tags, so neither is ever committed back to the branch
name: Build test release
on:
  pull_request:
    # only PR to main
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # unique and monotonic per run, so nothing has to be committed back to the
      # branch - a push here would retrigger this workflow on every run
      ACTIONLINT_PY_DEV_VERSION: ${{ github.run_number }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          # version.py reads the tags and the distance to them
          fetch-depth: 0
      - name: Set up Python
        id: set-up-python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - run: |
          python -m pip install --upgrade pip
          pip install build twine

      - run: |
          python -m build
          VERSION=$(python ./_custom_build/version.py)
          {
          echo "# Test pip install call"
          echo '```pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ --pre actionlint-py-kjanat=='"$VERSION"'```'
          } >> "$GITHUB_STEP_SUMMARY"

      - run: |
          {
          echo "# Twine check"
          python -m twine check dist/*
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  publish-to-test:
    name: Publish to test Pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: TestPyPI
    # trusted publishing: the OIDC token replaces an API token entirely
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v5
        with:
          name: build
          path: dist/
      - name: Keep only the source distribution
        # the wheel is platform tagged (e.g. linux_x86_64), which pypi rejects
        run: rm -f dist/*.whl
      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # a re-run reuses the run number, so the sdist is already uploaded
          skip-existing: true
