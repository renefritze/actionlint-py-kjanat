name: Test (tox)

on:
  pull_request:
  workflow_dispatch:

jobs:
  main-windows:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.11.1
    with:
      env: '["py311"]'
      os: windows-latest
      wheel-tags: true
  main-macos:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.11.1
    with:
      env: '["py311"]'
      os: macos-14
      wheel-tags: true
  # todo linux arm architecture is not tested
  main-linux:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.11.1
    with:
      env: '["py311"]'
      os: ubuntu-latest
