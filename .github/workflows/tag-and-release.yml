# only run on master and if package files changed
# bump build system version and publish package
name: Tag and release

on:
  # fix for existing version should be triggered manually
  workflow_dispatch:
  # tag should automatically trigger public release based on new version of actionlint binary
  push:
    branches:
      - main
    paths:
      - _custom_build/**
      - pyproject.toml
      - LICENSE
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: EndsWith(github.ref, 'main')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: 'Get Previous tag'
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v1"
      - uses: dorny/paths-filter@v2
        id: build_system_changed
        with:
          base: ${{ steps.previoustag.outputs.tag }}
          list-files: csv
          filters: |
            build:
              - '_custom_build/**.py'
              - pyproject.toml
              - LICENSE
              - _custom_build/checksums.cfg
            bin:
              - _custom_build/VERSION_ACTIONLINT.txt
            dev:
              - _custom_build/VERSION_DEV.txt
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          base: ${{ steps.previoustag.outputs.tag }}
          list-files: csv
          filters: |
            build:
              - '_custom_build/**.py'
              - pyproject.toml
              - LICENSE
              - _custom_build/checksums.cfg
            bin:
              - _custom_build/VERSION_ACTIONLINT.txt
            dev:
              - _custom_build/VERSION_DEV.txt

      - name: Increment build system version, reset dev version
        if: steps.changes.outputs.build == 'true'
        run: |
          echo "Previous version: $(python ./_custom_build/version.py)"
          python ./_custom_build/version.py --increment-build --reset-dev
          echo "Current version: $(python ./_custom_build/version.py)"
      - name: Reset dev version
        if: steps.changes.outputs.dev == 'true'
        run: |
          python ./_custom_build/version.py --reset-dev
      - name: Get version
        id: get-version
        run: |
          echo "version=$(python ./_custom_build/version.py --release)" | tee "$GITHUB_OUTPUT"
      - name: Push commit if needed
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: Increment build system version to ${{ steps.get-version.outputs.version }}
      - name: Push tag only
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          tagging_message: v${{ steps.get-version.outputs.version }}
          create_git_tag_only: true
    outputs:
      version: ${{ steps.get-version.outputs.version }}

  # build and publish live here rather than in a reusable workflow on purpose.
  # pypi mints the upload token from the job_workflow_ref claim (the workflow the
  # job runs in) but verifies the attestation against the certificate's build
  # config uri, which is workflow_ref (the workflow that was triggered). Behind a
  # workflow_call those two name different files and no single registered trusted
  # publisher can match both.
  build:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tag that was just pushed
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.tag.outputs.version }}
      - name: Set up Python
        id: set-up-python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - run: |
          python -m pip install --upgrade pip
          pip install build twine

      - run: |
          python -m build
          VERSION=$(python ./_custom_build/version.py)
          echo "# Release pip install call"
          echo '```pip install actionlint-py-kjanat=='"$VERSION"'```' >> "$GITHUB_STEP_SUMMARY"

      - run: |
          {
          echo "# Twine check"
          python -m twine check dist/*
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  publish-to-release:
    name: Publish to public Pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: PyPI
    # trusted publishing: the OIDC token replaces an API token entirely
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v5
        with:
          name: build
          path: dist/
      - name: Keep only the source distribution
        # the wheel is platform tagged (e.g. linux_x86_64), which pypi rejects
        run: rm -f dist/*.whl
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # a manual re-run of an already released version has nothing new to
          # upload, so treat it as a no-op instead of a 400 File already exists
          skip-existing: true
