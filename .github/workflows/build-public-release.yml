# this job does not increment versions, just plain build and publish
name: Build public release
on:
  push:
    # only PR to main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: Git tag (ref) to checkout
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        description: Git tag (ref) to checkout
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Python
        id: set-up-python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - run: |
          python -m pip install --upgrade pip
          pip install build twine

      - run: |
          python -m build
          VERSION=$(python ./_custom_build/version.py)
          echo "# Release pip install call"
          echo '```pip install actionlint-py-kjanat=='"$VERSION"'```' >> "$GITHUB_STEP_SUMMARY"

      - run: |
          {
          echo "# Twine check"
          python -m twine check dist/*
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  publish-to-release:
    name: Publish to public Pypi
    needs: build
    #    if: startsWith(github.ref, 'refs/tags') && !contains(github.ref, 'dev') && !contains(github.ref, 'release')
    runs-on: ubuntu-latest
    environment:
      name: PyPI
    # trusted publishing: the OIDC token replaces an API token entirely
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v5
        with:
          name: build
          path: dist/
      - name: Keep only the source distribution
        # the wheel is platform tagged (e.g. linux_x86_64), which pypi rejects
        run: rm -f dist/*.whl
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
